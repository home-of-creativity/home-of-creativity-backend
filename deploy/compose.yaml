# Linux VPS stack. From the backend repo root:
#   docker compose -f deploy/compose.yaml up -d --build
# Paths are relative to this file. Compose interpolates ../.env for ${DB_*} / ${APP_URL}.
name: hoc-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE:-hoc_platform}
    volumes:
      - hoc_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  hoc-api:
    build:
      context: ./php
    restart: unless-stopped
    working_dir: /var/www/hoc
    volumes:
      - ../:/var/www/hoc
      - hoc_vendor:/var/www/hoc/vendor
    expose:
      - "9000"
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
    command: >
      sh -c "composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      && php artisan migrate --force
      && php artisan storage:link || true
      && php-fpm -F -R"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000)===false);"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  hoc-dashboard:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ../dashboard:/app
      - hoc_dashboard_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${APP_URL:-https://hoc.agency}/api
    profiles:
      - tools
    command: sh -c "npm install && npm run build"

  hoc-scheduler:
    build:
      context: ./php
    restart: unless-stopped
    working_dir: /var/www/hoc
    volumes:
      - ../:/var/www/hoc
      - hoc_vendor:/var/www/hoc/vendor
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_LEVEL: error
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
    command: php artisan schedule:work
    depends_on:
      hoc-api:
        condition: service_healthy

  hoc-edge:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../:/var/www/hoc:ro
      - /var/www/landing/design:/var/www/design:ro
      - hoc_caddy_data:/data
      - hoc_caddy_config:/config
    depends_on:
      hoc-api:
        condition: service_started

  hoc-client-bot:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /var/www/hoc/bot
    volumes:
      - ../:/var/www/hoc
    env_file:
      - ../.env
    environment:
      HOC_API_URL: http://hoc-edge/api
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python main.py"
    depends_on:
      hoc-edge:
        condition: service_started

  hoc-staff-bot:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /var/www/hoc/bot
    volumes:
      - ../:/var/www/hoc
    env_file:
      - ../.env
    environment:
      HOC_API_URL: http://hoc-edge/api
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python staff.py"
    depends_on:
      hoc-edge:
        condition: service_started

  hoc-admin-bot:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /var/www/hoc/bot
    volumes:
      - ../:/var/www/hoc
    env_file:
      - ../.env
    environment:
      HOC_API_URL: http://hoc-edge/api
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python admin.py"
    depends_on:
      hoc-edge:
        condition: service_started

  hoc-dev-bot:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /var/www/hoc/bot
    volumes:
      - ../:/var/www/hoc
    env_file:
      - ../.env
    environment:
      HOC_API_URL: http://hoc-edge/api
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python dev.py"
    depends_on:
      hoc-edge:
        condition: service_started

volumes:
  hoc_mysql:
  hoc_vendor:
  hoc_dashboard_node_modules:
  hoc_caddy_data:
  hoc_caddy_config:
