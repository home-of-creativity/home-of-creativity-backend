# The Laravel API is not hosted or executed on GitHub.
# Production runs from the home_of_creativity Docker stack on the server/workstation.
name: Backend (not hosted on GitHub)

on:
  workflow_dispatch:

jobs:
  not_hosted:
    runs-on: ubuntu-latest
    steps:
      - name: Backend is production-only
        run: echo "GitHub does not start Laravel. Use Docker Compose in home_of_creativity."
