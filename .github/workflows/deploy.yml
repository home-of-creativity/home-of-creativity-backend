# Deploy the Laravel API, staff dashboard, and bots to the VPS over SSH.
# Auth is an SSH private key — do not set a deploy password.
name: Deploy (SSH)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: production-ssh
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync and restart on the server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set repository secret SSH_HOST to the server IP}"
          : "${SSH_USER:?Set repository secret SSH_USER (for example root)}"
          PORT="${SSH_PORT:-22}"
          REMOTE="${DEPLOY_PATH:-/var/www/landing/backend}"
          case "$REMOTE" in
            /var/www/*) ;;
            *) echo "DEPLOY_PATH must be under /var/www"; exit 1 ;;
          esac

          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH=(ssh -p "$PORT" -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '$REMOTE'"

          rsync -az \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'dashboard/node_modules/' \
            --exclude 'storage/app/' \
            --exclude 'storage/logs/' \
            --exclude 'storage/framework/' \
            --exclude 'public/storage/' \
            --exclude 'bot/.env' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            -e "ssh -p $PORT -o IdentitiesOnly=yes" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE}/"

          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "bash '$REMOTE/deploy/remote.sh'"
