# Deploy the Laravel API, staff dashboard, and bots to the VPS over SSH.
# Secrets: SSH_PRIVATE_KEY (+ SSH_PASSPHRASE if the key is encrypted).
name: Deploy (SSH)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: production-ssh
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        id: php
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, sqlite3, xml, curl, zip, bcmath, intl
          coverage: none

      - name: Install dependencies
        id: install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run API and bot tests
        id: tests
        run: php artisan test

      - name: Notify developer Telegram
        if: always()
        env:
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          PHP_SETUP: ${{ steps.php.outcome }}
          INSTALL: ${{ steps.install.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          JOB: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_DEV_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_DEV_CHAT_ID:-}" ]; then
            echo "Dev Telegram secrets are unset; skip notify"
            exit 0
          fi
          step="ok"
          if [ "$CHECKOUT" = "failure" ]; then step="Checkout"; fi
          if [ "$PHP_SETUP" = "failure" ]; then step="Setup PHP"; fi
          if [ "$INSTALL" = "failure" ]; then step="Install dependencies"; fi
          if [ "$TESTS" = "failure" ]; then step="Run API and bot tests"; fi
          text="GitHub tests ${JOB}
          step: ${step}
          ${{ github.sha }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_DEV_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_DEV_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -o /dev/null

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Start SSH agent
        id: ssh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
        run: |
          set -euo pipefail
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"

          key_file="$(mktemp)"
          askpass_file="$(mktemp)"
          trap 'rm -f "$key_file" "$askpass_file"' EXIT
          umask 177
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          chmod 600 "$key_file"
          if ! grep -q 'BEGIN OPENSSH PRIVATE KEY' "$key_file"; then
            echo "SSH_PRIVATE_KEY secret is missing OpenSSH header. Re-run deploy/push-github-secrets.ps1"
            exit 1
          fi

          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            export SSH_PASSPHRASE
            printf '%s\n' '#!/bin/sh' 'exec printf "%s" "$SSH_PASSPHRASE"' > "$askpass_file"
            chmod 700 "$askpass_file"
            DISPLAY=:0 SSH_ASKPASS="$askpass_file" SSH_ASKPASS_REQUIRE=force ssh-add "$key_file" < /dev/null
          else
            ssh-add "$key_file" < /dev/null
          fi

      - name: Upload code
        id: upload
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          BACKEND_ENV_FILE_B64: ${{ secrets.BACKEND_ENV_FILE_B64 }}
          GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Set repository secret SSH_HOST to the server IP}"
          : "${SSH_USER:?Set repository secret SSH_USER (for example root)}"
          : "${BACKEND_ENV_FILE_B64:?Set repository secret BACKEND_ENV_FILE_B64 (run deploy/push-backend-env-secret.ps1)}"
          PORT="${SSH_PORT:-22}"
          REMOTE="${DEPLOY_PATH:-/var/www/landing/backend}"
          case "$REMOTE" in
            /var/www/*) ;;
            *) echo "DEPLOY_PATH must be under /var/www"; exit 1 ;;
          esac

          mkdir -p ~/.ssh
          ssh-keyscan -p "$PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH=(ssh -p "$PORT" -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "mkdir -p '$REMOTE'"

          rsync -az \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'vendor/' \
            --exclude 'node_modules/' \
            --exclude 'dashboard/node_modules/' \
            --exclude 'storage/app/' \
            --exclude 'storage/logs/' \
            --exclude 'storage/framework/' \
            --exclude 'public/storage/' \
            --exclude 'bot/.env' \
            --exclude 'playwright-report/' \
            --exclude 'test-results/' \
            -e "ssh -p $PORT" \
            ./ "${SSH_USER}@${SSH_HOST}:${REMOTE}/"

          echo "$BACKEND_ENV_FILE_B64" | base64 -d | tr -d '\r' | "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "umask 177; cat > '$REMOTE/.env' && chmod 600 '$REMOTE/.env'"

          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON_B64:-}" ]; then
            echo "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" | base64 -d | tr -d '\r' | "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "umask 177; mkdir -p '$REMOTE/storage/app/private' && cat > '$REMOTE/storage/app/private/google-sa.json' && chmod 600 '$REMOTE/storage/app/private/google-sa.json'"
          fi

      - name: Run server script
        id: remote
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          REMOTE="${DEPLOY_PATH:-/var/www/landing/backend}"
          SSH=(ssh -p "$PORT" -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "${SSH_USER}@${SSH_HOST}" "bash '$REMOTE/deploy/remote.sh'"

      - name: Notify developer Telegram
        if: always()
        env:
          TELEGRAM_DEV_BOT_TOKEN: ${{ secrets.TELEGRAM_DEV_BOT_TOKEN }}
          TELEGRAM_DEV_CHAT_ID: ${{ secrets.TELEGRAM_DEV_CHAT_ID }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          SSH_STEP: ${{ steps.ssh.outcome }}
          UPLOAD: ${{ steps.upload.outcome }}
          REMOTE: ${{ steps.remote.outcome }}
          JOB: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_DEV_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_DEV_CHAT_ID:-}" ]; then
            echo "Dev Telegram secrets are unset; skip notify"
            exit 0
          fi
          step="ok"
          if [ "$CHECKOUT" = "failure" ]; then step="Checkout"; fi
          if [ "$SSH_STEP" = "failure" ]; then step="Start SSH agent"; fi
          if [ "$UPLOAD" = "failure" ]; then step="Upload code"; fi
          if [ "$REMOTE" = "failure" ]; then step="Run server script"; fi
          text="GitHub deploy ${JOB}
          step: ${step}
          ${{ github.sha }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_DEV_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_DEV_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            -o /dev/null
